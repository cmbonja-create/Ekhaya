<title>Ekhaya Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone app. A menu of five games, then a full-bleed canvas under a slim score bar. Single night-village look. */
:root{
  --ink:#10172a; --panel:#1a2340; --line:#2b3661; --maize:#ffc23d;
  --text:#eef0f7; --muted:#98a2c4; --bad:#ff6b5a; --good:#5fd38d;
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--maize);outline-offset:2px}

/* Menu */
.menu{flex:1;overflow-y:auto;width:100%;max-width:560px;margin:0 auto;
  padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1;margin:0;color:var(--maize);letter-spacing:.01em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.45}
.list{display:flex;flex-direction:column;gap:12px}
.game{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;
  transition:transform .12s ease,border-color .12s ease}
.game:active{transform:scale(.98);border-color:var(--maize)}
.game svg{width:56px;height:56px;display:block}
.game .txt{min-width:0}
.game h2{margin:0;font-size:17px;font-weight:800}
.game p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}
.best{text-align:right}
.best small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.best b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--maize);font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:4px 0 0}

/* Play view */
.play{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:12px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.back{background:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.back:active{background:var(--line)}
.back svg{width:22px;height:22px}
.bar .nm{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{text-align:right;line-height:1}
.sc small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sc b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--maize);font-variant-numeric:tabular-nums}
.stage{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 32px);
  background:rgba(16,23,42,.88);border:1px solid var(--line);padding:8px 14px;border-radius:999px;
  font-size:13.5px;font-weight:700;text-align:center;pointer-events:none;transition:opacity .4s ease}
.hint.fade{opacity:0}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,28,.62);padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 22px;width:min(320px,100%);text-align:center;
  animation:rise .25s ease}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.card h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--text)}
.card .big{font-family:var(--display);font-size:56px;line-height:1.1;color:var(--maize);margin:10px 0 2px;font-variant-numeric:tabular-nums}
.card .sub{color:var(--muted);font-size:14px;margin:0}
.card .nb{color:var(--good);font-weight:800;font-size:14px;margin:6px 0 0}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}
.btn.pri{background:var(--maize);color:var(--ink)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.5}
.btn.watch{background:transparent;border:1.5px solid var(--maize);color:var(--maize)}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,28,.55);padding:16px;overflow-y:auto}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 20px;width:min(340px,100%);display:flex;flex-direction:column;gap:14px;animation:rise .25s ease}
.logo{font-family:var(--display);font-size:clamp(34px,11vw,44px);line-height:.95;color:var(--maize);text-align:center;margin:4px 0 0}
.tag{color:var(--muted);text-align:center;font-size:14px;margin:-4px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--ink);border-radius:14px;padding:12px 8px}
.stats div{text-align:center;min-width:0}
.stats small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.stats b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--text);font-variant-numeric:tabular-nums}
.btn.big{font-size:20px;padding:16px;font-family:var(--display);font-weight:400;letter-spacing:.04em}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .btn{font-size:13.5px;padding:12px 6px}
.tcard h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-align:center}
.set{display:flex;flex-direction:column;gap:8px}
.set>label{font-weight:800;font-size:14px}
.set p{margin:0;color:var(--muted);font-size:12.5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--ink);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--maize);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.carbtn{border:1.5px solid var(--line);background:var(--ink);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800}
.carbtn[aria-pressed="true"]{border-color:var(--maize)}
.carbtn:disabled{opacity:.45}
.carbtn svg{width:30px;height:48px}
.carbtn span{color:var(--muted);font-weight:700;font-size:11px}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.tcard{animation:none}.card{animation:none}.game{transition:none}}
</style>

</head>
<body>
<div id="app">
  <main class="menu" id="menu">
    <header class="brand">
      <h1>Ekhaya Arcade</h1>
      <p>Small games. No ads, no sign-up. Your best scores stay on this phone.</p>
    </header>
    <div class="list" id="list"></div>
    <p class="foot">Works offline once it has opened once.</p>
  </main>

  <section class="play" id="play" hidden>
    <div class="bar">
      <button class="back" id="back" aria-label="Back to games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="nm" id="nm"></div>
      <button class="back" id="pauseBtn" aria-label="Pause" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
      <button class="back" id="mute" aria-label="Sound"></button>
      <div class="sc"><small>Best</small><b id="bestNow">0</b></div>
      <div class="sc"><small>Score</small><b id="score">0</b></div>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint"></div>
      <div class="panel" id="title" hidden>
        <div class="tcard">
          <div class="logo">GRAVEL<br>ROAD DASH</div>
          <p class="tag">Swipe. Dodge. Mind the goats.<br><span id="tTag" style="font-size:12.5px"></span></p>

const Sfx={ctx:null,master:null,nb:null,eng:null,muted:store.get('ekhaya_mute',false),
  init(){

    try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:0.9;this.master.connect(this.ctx.destination);
      const n=this.ctx.sampleRate,b=this.ctx.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nb=b;

      const vs=ss.getVoices()||[];const v=vs.find(v=>/en[-_]ZA/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;

  horn(dur,delay=0){
    if(!this.ctx)return;try{const c=this.ctx,t=c.currentTime+delay,f=c.createBiquadFilter(),g=c.createGain();
      f.type='lowpass';f.frequency.value=1900;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.015);

  },
  taxiHonk(delay=0){this.horn(.09,delay);this.horn(.09,delay+.14);this.horn(.42,delay+.28)},

const Stack={id:'stack',title:'Stack the House',hint:'Tap to drop the block. Land it clean.',tapOnDown:true,

const Bottle={id:'bottle',title:'Bottle Line',hint:'Tap the bad bottles: cracked, short or orange. Leave the good ones.',tapOnDown:true,

function wrapText(g,text,maxW){const words=text.split(' '),lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(g.measureText(t).width>maxW&&l){lines.push(l);l=w}else l=t}if(l)lines.push(l);return lines}
const DIFF={chill:{s0:200,ramp:5,max:560,dens:.75,label:'Chilled'},normal:{s0:240,ramp:8,max:700,dens:1,label:'Normal'},hectic:{s0:290,ramp:11,max:820,dens:1.25,label:'Hectic'}};
const CARS=[{n:'Maize',c:'#ffc23d',d:'#d79b1c',need:0},{n:'Fire red',c:'#e04a3a',d:'#ad3327',need:30},{n:'Taxi white',c:'#f2f2ee',d:'#c9c9c0',need:80},
  {n:'Ocean blue',c:'#3a7be0',d:'#285aa8',need:160},{n:'Bush green',c:'#4f9a45',d:'#387031',need:300},{n:'Midnight',c:'#3a4060',d:'#232842',need:500}];
const Road={id:'road',menu:true,title:'Gravel Road Dash',hint:'Swipe left or right to switch lanes. Taxis stop without warning.',swipe:true,ownEndSound:true,
  init(){this.D=DIFF[store.get('road_diff','normal')]||DIFF.normal;this.lane=1;this.cx=null;this.objs=[];this.dist=0;this.coins=0;this.sp=this.D.s0;this.next=260;this.scroll=0;this.t=0;this.fx=[];
    this.hist=[];this.nid=0;this.rp=null;this.why='';this.culprit=0;
    this.dots=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:rand(1,2.6),c:Math.random()<.5?'#7f6243':'#b8956a'}));
    this.tufts=Array.from({length:24},()=>({x:Math.random(),y:Math.random(),s:Math.random()<.5?0:1}));
  },
  onStart(){Sfx.engineStart()},
  key(){const d=store.get('road_diff','normal');return d==='normal'?'road':'road_'+d},
  car(){const i=store.get('road_car',0);return CARS[i]&&store.get('road_coins',0)>=CARS[i].need?CARS[i]:CARS[0]},
  attract(dt){this.scroll+=170*dt;if(this.cx==null)this.cx=this.laneX(1)},
  onEnd(){store.set('road_runs',store.get('road_runs',0)+1);store.set('road_coins',store.get('road_coins',0)+this.coins)},
  fillTitle(){const d=store.get('road_diff','normal');$('tBestLbl').textContent='Best';$('tBest').textContent=store.get(bestKey(this),0);$('tTag').textContent='Difficulty: '+DIFF[d].label+'. Change it in Settings.';
    $('tRuns').textContent=store.get('road_runs',0);$('tCoins').textContent=store.get('road_coins',0)},
  sheet(kind){
    const B=$('sheetBody');B.innerHTML='';
    const seg=(label,note,opts,keyName,def,onPick)=>{const w=document.createElement('div');w.className='set';
      w.innerHTML=`<label>${label}</label>`;const sg=document.createElement('div');sg.className='seg';const cur0=store.get(keyName,def);
      for(const [v,t] of opts){const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed',String(cur0===v));
        b.onclick=()=>{store.set(keyName,v);sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));onPick&&onPick(v);Sfx.tone(520,.05,{type:'triangle',vol:.07})};sg.appendChild(b)}
      w.appendChild(sg);if(note){const p=document.createElement('p');p.textContent=note;w.appendChild(p)}B.appendChild(w)};
    if(kind==='settings'){
      $('sheetTitle').textContent='Settings';
      const sfxOn=!Sfx.muted;
      const w=document.createElement('div');w.className='set';w.innerHTML='<label>Sound effects</label>';const sg=document.createElement('div');sg.className='seg';
      [['On',true],['Off',false]].forEach(([t,v])=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed',String(sfxOn===v));
        b.onclick=()=>{Sfx.init();Sfx.setMute(!v);paintMute();sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};sg.appendChild(b)});
      w.appendChild(sg);B.appendChild(w);
      seg('Engine sound',null,[[true,'On'],[false,'Off']],'ekhaya_engine',true);
      seg('Difficulty',paused?'Changes start on your next run.':'Each difficulty keeps its own best score.',[['chill','Chilled'],['normal','Normal'],['hectic','Hectic']],'road_diff','normal');
      seg('Swipe sensitivity','Light reacts to the smallest flick. Firm needs a longer swipe.',[['light','Light'],['normal','Normal'],['firm','Firm']],'ekhaya_swipe','normal');
      const r=document.createElement('button');r.className='btn danger';r.textContent='Reset scores and stats';let armed=0;
      r.onclick=()=>{if(!armed){armed=1;r.textContent='Tap again to reset';setTimeout(()=>{armed=0;r.textContent='Reset scores and stats'},3000);return}
        ['ekhaya_best_road','ekhaya_best_road_chill','ekhaya_best_road_hectic','road_runs','road_coins','road_car'].forEach(k=>store.set(k,0));r.textContent='Scores reset';r.disabled=true;$('bestNow').textContent=0};
      B.appendChild(r);
    }else if(kind==='garage'){
      $('sheetTitle').textContent='Garage';
      const have=store.get('road_coins',0),sel=CARS.indexOf(this.car());
      const p=document.createElement('p');p.style.cssText='text-align:center;margin:0';p.textContent=`You've banked ${have} coins. Collect more to unlock bakkies.`;B.appendChild(p);
      const grid=document.createElement('div');grid.className='cars';
      CARS.forEach((c,i)=>{const b=document.createElement('button');b.className='carbtn';const open=have>=c.need;b.disabled=!open;b.setAttribute('aria-pressed',String(i===sel));
        b.innerHTML=`<svg viewBox="0 0 30 48"><rect x="1" y="6" width="4" height="9" rx="1.5" fill="#1b1b1b"/><rect x="25" y="6" width="4" height="9" rx="1.5" fill="#1b1b1b"/><rect x="1" y="32" width="4" height="9" rx="1.5" fill="#1b1b1b"/><rect x="25" y="32" width="4" height="9" rx="1.5" fill="#1b1b1b"/><rect x="3" y="2" width="24" height="44" rx="6" fill="${c.c}"/><rect x="6" y="9" width="18" height="8" rx="2.5" fill="#1b2236"/><rect x="6" y="24" width="18" height="17" rx="2" fill="${c.d}"/></svg>${c.n}<span>${open?(i===sel?'Driving':'Ready'):c.need+' coins'}</span>`;
        b.onclick=()=>{store.set('road_car',i);this.sheet('garage');Sfx.tone(660,.08,{type:'triangle',vol:.08})};grid.appendChild(b)});
      B.appendChild(grid);
    }else{
      $('sheetTitle').textContent='How to play';
      B.innerHTML=`<ol class="how"><li>Swipe left or right to change lanes.</li><li>Dodge potholes, goats and taxis. Taxis drive slow, then brake without warning when the hand comes out.</li><li>Grab coins for 10 points each. They also unlock bakkies in the Garage.</li><li>The road speeds up the longer you last. There's always one open lane.</li><li>After a crash, tap "See what went wrong" for a slow-mo replay.</li></ol>`;
    }
  },
  geo(){const rw=Math.min(W*0.8,420);return{rw,x0:(W-rw)/2,lw:rw/3}},
  laneX(l){const {x0,lw}=this.geo();return x0+lw*(l+0.5)},
  carY(){return H-Math.max(90,H*0.16)},
  spawn(){
    /* Fairness rule: a lane is busy if something sits near the top of the road (within reaction distance,
       which grows with speed) or a taxi is still creeping ahead. New obstacles only go in free lanes,
       and at least one lane is always left open. */
    const {lw}=this.geo(),carH=Math.min(88,lw*1.3),win=lw*1.4+carH+this.sp*0.3,busy=new Set();
    for(const o of this.objs){if(o.type==='coin')continue;
      if(o.y<win||(o.type==='taxi'&&!o.stopped&&o.y<this.carY()))busy.add(o.lane)}
    const free=[0,1,2].filter(l=>!busy.has(l)).sort(()=>Math.random()-.5);
    const want=Math.random()<Math.min(0.6,(0.2+this.t*0.006)*this.D.dens)?2:1;
    const n=Math.max(0,Math.min(want,free.length-1));
    free.forEach((l,i)=>{
      if(i<n){
        const pool=this.t<6?['pothole','goat']:['pothole','goat','taxi'];const type=pool[ri(pool.length)];
        const o={lane:l,type,id:++this.nid};
        if(type==='pothole'){o.w=lw*0.6;o.h=lw*0.36}
        else if(type==='goat'){o.w=lw*0.42;o.h=lw*0.62;o.wob=Math.random()*6}
        else{o.w=lw*0.66;o.h=lw*1.3;o.stopAt=rand(H*0.1,H*0.45);o.stopped=false;o.stopT=0;o.side=l===0?-1:l===2?1:(Math.random()<.5?-1:1)}
        o.y=-o.h;this.objs.push(o);
      }else if(Math.random()<0.35){this.objs.push({lane:l,type:'coin',id:++this.nid,w:lw*0.32,h:lw*0.32,y:-lw*0.32})}
    });
  },
  snap(){
    this.hist.push({t:this.t,cx:this.cx,scroll:this.scroll,dist:this.dist,coins:this.coins,objs:this.objs.map(o=>({...o}))});
    while(this.hist.length&&this.t-this.hist[0].t>3.5)this.hist.shift();
  },
  hoot(){Sfx.taxiHonk()},
  update(dt){
    this.t+=dt;this.sp=Math.min(this.D.max,this.D.s0+this.t*this.D.ramp);const d=this.sp*dt;this.dist+=d;this.scroll+=d;
    Sfx.engineSet(this.sp);
    const tx=this.laneX(this.lane);if(this.cx==null)this.cx=tx;this.cx+=(tx-this.cx)*Math.min(1,dt*16);
    this.next-=d;if(this.next<=0){this.spawn();this.next=Math.max(150,340-this.t*3.5)*rand(0.75,1.25)/this.D.dens}
    for(const o of this.objs){
      let v=this.sp;
      if(o.type==='taxi'){if(!o.stopped&&o.y>o.stopAt){o.stopped=true;this.hoot()}if(o.stopped)o.stopT+=dt;v=o.stopped?this.sp:this.sp*0.4}
      if(o.type==='goat'){o.wob+=dt*5;if(!o.seen&&o.y>0){o.seen=true;Sfx.tone(560,.34,{type:'sawtooth',vol:.035,to:470})}}
      o.y+=v*dt;
    }
    const {lw}=this.geo(),cy=this.carY(),carH=Math.min(88,lw*1.3),carW=carH*0.56;
    for(const o of this.objs){
      if(o.hit)continue;const ox=this.laneX(o.lane);
      if(Math.abs(ox-this.cx)<(carW+o.w)*0.42&&o.y+o.h/2>cy-carH/2+6&&o.y-o.h/2<cy+carH/2-6){
        if(o.type==='coin'){o.hit=true;this.coins++;this.fx.push({x:ox,y:o.y,t:0});
          Sfx.tone(988,.08,{type:'square',vol:.07});Sfx.tone(1319,.2,{type:'square',vol:.07,delay:.07})}
        else{this.crash(o);return}
      }
    }
    this.objs=this.objs.filter(o=>!o.hit&&o.y-o.h<H+40);
    for(const f of this.fx)f.t+=dt;this.fx=this.fx.filter(f=>f.t<0.6);
    setScore(Math.floor(this.dist/50)+this.coins*10);
    this.snap();
  },
  crash(o){
    const what=o.type==='taxi'?(o.stopped?'A taxi braked hard in your lane.':'You caught up to a slow taxi.'):o.type==='goat'?'A goat was standing in your lane.':'You drove straight into a pothole.';
    const moving=Math.abs(this.cx-this.laneX(this.lane))>6;
    const how=moving?(o.lane===this.lane?' You swerved right into it.':' You started switching lanes too late.'):' Swipe away earlier when you see it coming.';
    this.why=what+how;this.culprit=o.id;
    this.snap();
    const ox=this.laneX(o.lane),cy=this.carY();
    if(o.type==='pothole'){Sfx.tone(80,.35,{vol:.55,to:35});Sfx.noise(.3,{vol:.35,freq:500,to:80,type:'lowpass'});this.fx.push({x:this.cx,y:cy-50,t:0,txt:'EISH!',col:'#ff6b5a'})}
    else if(o.type==='goat'){Sfx.tone(120,.25,{vol:.35,to:60});Sfx.goat(.05)}
    else{Sfx.noise(.7,{vol:.55,freq:900,to:90,type:'lowpass'});Sfx.tone(95,.45,{vol:.5,to:38});Sfx.horn(.9,.12);this.fx.push({x:ox,y:o.y-o.h/2-14,t:0,txt:'HOOOOT!',col:'#ffc23d'})}
    Haptic.go('crash');
    end(o.type==='taxi'?'Taxi stopped!':o.type==='goat'?'Hit a goat!':'Pothole!');
  },
  canReplay(){return this.hist.length>5},
  startReplay(){this.rp={t:0,hold:0};Sfx.tone(700,.35,{type:'triangle',vol:.06,to:220})},
  stopReplay(){if(!this.rp)return;this.rp=null;showOver()},
  replayStep(dt){
    const r=this.rp,dur=this.hist[this.hist.length-1].t-this.hist[0].t;
    if(r.t<dur){const near=dur-r.t<0.8;r.t=Math.min(dur,r.t+dt*(near?0.22:0.5))}
    else{if(r.hold===0)Sfx.noise(.5,{vol:.25,freq:700,to:90,type:'lowpass'});r.hold+=dt;if(r.hold>4)this.stopReplay()}
  },
  frame(){const t0=this.hist[0].t+this.rp.t;let f=this.hist[0];for(const h of this.hist){if(h.t<=t0+1e-6)f=h;else break}return f},
  swipe(d){const b=this.lane;if(d==='L')this.lane=Math.max(0,this.lane-1);if(d==='R')this.lane=Math.min(2,this.lane+1);
    if(this.lane!==b){Sfx.noise(.15,{vol:.13,freq:1700,to:450,type:'bandpass'});Haptic.go('swipe')}},
  draw(g){if(this.rp){const f=this.frame();this.render(g,f,[]);this.replayOverlay(g,f)}else this.render(g,this,this.fx)},
  replayOverlay(g,f){
    const r=this.rp;
    g.fillStyle='rgba(10,14,28,.18)';g.fillRect(0,0,W,H);
    g.fillStyle='rgba(10,14,28,.88)';g.fillRect(0,0,W,40);
    if(Math.floor(performance.now()/450)%2){g.fillStyle='#ff6b5a';g.beginPath();g.arc(20,20,6,0,7);g.fill()}
    g.textBaseline='middle';g.font=`14px ${FONT}`;g.textAlign='left';g.fillStyle='#fff';g.fillText('REPLAY',34,21);
    g.font=`800 12px ${BODY}`;g.fillStyle='#98a2c4';g.fillText(r.hold>0?'':'slow-mo',106,21);
    g.textAlign='right';g.fillText('Tap to skip',W-14,21);g.textBaseline='alphabetic';
    const o=f.objs.find(o=>o.id===this.culprit);
    if(o){const x=this.laneX(o.lane),rad=Math.max(o.w,o.h)*0.7+6+Math.sin(performance.now()/150)*3;
      g.save();g.strokeStyle='#ffc23d';g.lineWidth=3;g.setLineDash([8,6]);g.beginPath();g.arc(x,o.y,rad,0,7);g.stroke();g.restore();
      g.font=`800 12px ${BODY}`;g.fillStyle='#ffc23d';g.textAlign='center';
      const label=o.type==='taxi'?(o.stopped?'Taxi braking':'Slow taxi'):o.type==='goat'?'Goat':'Pothole';
      const ly=o.y-rad-10>52?o.y-rad-10:o.y+rad+18;g.fillText(label,x,ly)}
    if(r.hold>0){
      const pw=Math.min(W-32,420),px=(W-pw)/2;g.font=`700 15px ${BODY}`;
      const lines=wrapText(g,this.why,pw-32),ph=48+lines.length*21,py=H-ph-20;
      g.globalAlpha=Math.min(1,r.hold*3);
      g.fillStyle='rgba(16,23,42,.94)';rr(g,px,py,pw,ph,16);g.fill();g.strokeStyle='#2b3661';g.lineWidth=1;g.stroke();
      g.textAlign='left';g.fillStyle='#ffc23d';g.font=`14px ${FONT}`;g.fillText('WHAT WENT WRONG',px+16,py+26);
      g.fillStyle='#eef0f7';g.font=`700 15px ${BODY}`;lines.forEach((l,i)=>g.fillText(l,px+16,py+50+i*21));
      g.globalAlpha=1;
    }
  },
  arm(g,o,x,y){
    const sd=o.side||1,tw=o.w,th=o.h,t=o.stopT||0,len=Math.max(18,tw*0.42);
    const ax=x+sd*(tw/2-2),ay=y-th*0.18,wave=Math.sin(t*14)*0.45;
    g.save();g.translate(ax,ay);g.rotate(sd*(-0.35+wave));
    g.fillStyle='#7a4a2b';rr(g,sd>0?0:-len,-4,len,8,4);g.fill();
    const hx=sd*len;g.fillStyle='#8d5733';g.beginPath();g.arc(hx,0,7,0,7);g.fill();
    g.strokeStyle='#8d5733';g.lineWidth=3;g.lineCap='round';g.beginPath();
    const base=sd>0?0:Math.PI;for(const k of [-0.75,-0.25,0.25,0.75]){const a=base+k;g.moveTo(hx,0);g.lineTo(hx+Math.cos(a)*12,Math.sin(a)*12)}
    g.stroke();g.restore();
    if(t<2.4){
      g.font=`15px ${FONT}`;const txt='Towni?',tw2=g.measureText(txt).width+18,bh=28;
      let bx=x+sd*(tw/2+len*0.6)-tw2/2;bx=Math.max(6,Math.min(W-tw2-6,bx));const by=y-th/2-bh-6;
      const a=Math.min(1,t*6,(2.4-t)*3),pop=1+Math.max(0,0.25-t)*1.2;
      g.save();g.globalAlpha=a;g.translate(bx+tw2/2,by+bh/2);g.scale(pop,pop);
      g.fillStyle='#fff';rr(g,-tw2/2,-bh/2,tw2,bh,10);g.fill();
      const tx=Math.max(-tw2/2+8,Math.min(tw2/2-8,(ax-(bx+tw2/2))));g.beginPath();g.moveTo(tx-6,bh/2-1);g.lineTo(tx+6,bh/2-1);g.lineTo(tx+sd*4,bh/2+9);g.fill();
      g.fillStyle='#10172a';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,1);g.textBaseline='alphabetic';g.restore();
    }
  },
  render(g,s,fx){
    const {rw,x0,lw}=this.geo();
    g.fillStyle='#3b6e36';g.fillRect(0,0,W,H);
    for(const t of this.tufts){const y=(t.y*H+s.scroll)%(H+20)-10;const x=t.s?x0+rw+10+t.x*(W-x0-rw-20):10+t.x*(x0-20);
      g.fillStyle='#2c5629';g.beginPath();g.arc(x,y,5,0,7);g.arc(x+6,y+3,4,0,7);g.fill()}
    g.fillStyle='#a07e57';g.fillRect(x0,0,rw,H);
    g.fillStyle='#8c6c48';g.fillRect(x0-4,0,4,H);g.fillRect(x0+rw,0,4,H);
    for(const p of this.dots){const y=(p.y*H+s.scroll)%H;g.fillStyle=p.c;g.beginPath();g.arc(x0+p.x*rw,y,p.r,0,7);g.fill()}
    g.fillStyle='rgba(255,240,210,.18)';
    for(let l=1;l<3;l++){const x=x0+lw*l-2;for(let y=-40+(s.scroll%60);y<H;y+=60)g.fillRect(x,y,4,28)}
    for(const o of s.objs){const x=this.laneX(o.lane),y=o.y;
      if(o.type==='pothole'){g.fillStyle='#5a4329';g.beginPath();g.ellipse(x,y,o.w/2,o.h/2,0,0,7);g.fill();g.fillStyle='#2b2016';g.beginPath();g.ellipse(x,y+2,o.w/2-5,o.h/2-4,0,0,7);g.fill()}
      else if(o.type==='goat'){const sz=o.w,wob=Math.sin(o.wob)*2;
        g.fillStyle='#f2efe6';g.beginPath();g.ellipse(x,y+sz*0.15,sz*0.38,sz*0.62,0,0,7);g.fill();
        g.fillStyle='#5b4632';g.beginPath();g.ellipse(x+wob*0.3,y-sz*0.1,sz*0.18,sz*0.22,0,0,7);g.fill();
        g.fillStyle='#e9e4d6';g.beginPath();g.arc(x+wob,y+sz*0.85,sz*0.24,0,7);g.fill();
        g.strokeStyle='#6b5a44';g.lineWidth=3;g.beginPath();g.moveTo(x+wob-sz*0.12,y+sz*0.75);g.lineTo(x+wob-sz*0.28,y+sz*0.55);g.moveTo(x+wob+sz*0.12,y+sz*0.75);g.lineTo(x+wob+sz*0.28,y+sz*0.55);g.stroke()}
      else if(o.type==='taxi'){const tw=o.w,th=o.h;
        g.fillStyle='#f4f4f0';rr(g,x-tw/2,y-th/2,tw,th,tw*0.18);g.fill();
        g.fillStyle='#2b6fd6';g.fillRect(x-tw/2,y-th*0.05,tw,th*0.1);
        g.fillStyle='#1b2236';rr(g,x-tw/2+5,y-th/2+th*0.08,tw-10,th*0.16,5);g.fill();rr(g,x-tw/2+5,y+th*0.3,tw-10,th*0.12,4);g.fill();
        g.fillStyle=o.stopped?'#ff3b30':'#7a2a24';g.fillRect(x-tw/2+3,y+th/2-7,tw*0.25,5);g.fillRect(x+tw/2-3-tw*0.25,y+th/2-7,tw*0.25,5);
        if(o.stopped){g.fillStyle='rgba(255,59,48,.25)';g.beginPath();g.arc(x,y+th/2,tw*0.7,0,Math.PI);g.fill();this.arm(g,o,x,y)}}
      else{const r=o.w/2;g.fillStyle='#d9a521';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='#ffd25a';g.beginPath();g.arc(x,y,r*0.78,0,7);g.fill();
        g.fillStyle='#9a6f0d';g.font=`${Math.round(r)}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText('R',x,y+1);g.textBaseline='alphabetic'}
    }
    const cy=this.carY(),carH=Math.min(88,lw*1.3),carW=carH*0.56,x=s.cx??this.laneX(1);
    g.fillStyle='#1b1b1b';for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){rr(g,x+dx*carW*0.5-5,cy+dy*carH*0.3-8,10,16,3);g.fill()}
    const CC=this.car();g.fillStyle=CC.c;rr(g,x-carW/2,cy-carH/2,carW,carH,carW*0.22);g.fill();
    g.fillStyle='#1b2236';rr(g,x-carW/2+5,cy-carH/2+carH*0.16,carW-10,carH*0.18,5);g.fill();
    g.fillStyle=CC.d;rr(g,x-carW/2+5,cy+carH*0.08,carW-10,carH*0.36,4);g.fill();
    g.strokeStyle='rgba(0,0,0,.22)';g.lineWidth=1.5;for(let i=1;i<4;i++){const yy=cy+carH*0.08+i*carH*0.09;g.beginPath();g.moveTo(x-carW/2+7,yy);g.lineTo(x+carW/2-7,yy);g.stroke()}
    g.fillStyle='#fff6c8';g.fillRect(x-carW/2+3,cy-carH/2+2,7,4);g.fillRect(x+carW/2-10,cy-carH/2+2,7,4);
    g.textAlign='center';g.font=`18px ${FONT}`;
    for(const f of fx){g.globalAlpha=1-f.t/0.6;g.fillStyle=f.col||'#ffc23d';g.font=f.txt?`24px ${FONT}`:`18px ${FONT}`;g.fillText(f.txt||'+10',Math.max(70,Math.min(W-70,f.x)),f.y-f.t*50)}
    g.globalAlpha=1;
    g.textAlign='left';g.font=`800 13px ${BODY}`;g.fillStyle='#fff';
    if(!titleMode)g.fillText(Math.floor(s.dist/50)+' m  ·  '+s.coins+' coins',12,H-14);
  }
};

/* ============ 4. HERDBOY ============ */
const Herd={id:'herd',title:'Herdboy',hint:'Swipe to steer, or tap the side you want to turn. Don’t hit your own herd.',swipe:true,
  init(){
    this.cols=13;this.layout();
    const y=Math.floor(this.rows/2);
    this.snake=[{x:5,y},{x:4,y},{x:3,y}];this.prev=this.snake.map(s=>({...s}));
    this.dir={x:1,y:0};this.q=[];this.acc=0;this.cows=0;this.grow=0;this.place();this.pulse=0;
  },
  layout(){this.cell=Math.floor(Math.min(W/this.cols,52));this.rows=Math.max(10,Math.floor((H-12)/this.cell));
    this.ox=Math.floor((W-this.cols*this.cell)/2);this.oy=Math.floor((H-this.rows*this.cell)/2)},
  resize(){const oc=this.cols,or=this.rows;this.layout();if(this.rows<or){this.rows=or;}},
  interval(){return Math.max(0.075,0.18-this.cows*0.0045)},
  place(){let p;do{p={x:ri(this.cols),y:ri(this.rows)}}while(this.snake.some(s=>s.x===p.x&&s.y===p.y));this.food=p;this.foodSpot=Math.random()<.5},
  swipe(d){const m={L:{x:-1,y:0},R:{x:1,y:0},U:{x:0,y:-1},D:{x:0,y:1}}[d];
    const last=this.q.length?this.q[this.q.length-1]:this.dir;
    if(m.x===-last.x&&m.y===-last.y)return;if(m.x===last.x&&m.y===last.y)return;
    if(this.q.length<3)this.q.push(m)},
  tap(x,y){const h=this.snake[0],last=this.q.length?this.q[this.q.length-1]:this.dir;
    const hx=this.ox+(h.x+0.5)*this.cell,hy=this.oy+(h.y+0.5)*this.cell;
    if(last.x!==0)this.swipe(y<hy?'U':'D');else this.swipe(x<hx?'L':'R')},
  update(dt){
    this.pulse+=dt;this.acc+=dt;const iv=this.interval();
    while(this.acc>=iv){this.acc-=iv;if(!this.step())return}
  },
  step(){
    if(this.q.length)this.dir=this.q.shift();
    const h=this.snake[0],n={x:h.x+this.dir.x,y:h.y+this.dir.y};
    if(n.x<0||n.y<0||n.x>=this.cols||n.y>=this.rows){end('Out of the kraal');return false}
    const eat=n.x===this.food.x&&n.y===this.food.y;
    const body=eat||this.grow>0?this.snake:this.snake.slice(0,-1);
    if(body.some(s=>s.x===n.x&&s.y===n.y)){end('Herd crashed');return false}
    this.prev=this.snake.map(s=>({...s}));
    this.snake.unshift(n);
    if(eat){Sfx.tone(150,.4,{type:'sawtooth',vol:.05,to:112});Sfx.tone(880,.06,{type:'triangle',vol:.08});this.cows++;setScore(this.cows);this.grow=0;this.place()}
    else this.snake.pop();
    return true;
  },
  cow(g,cx,cy,r,brown,spot){
    g.fillStyle=brown?'#8a5a34':'#f3efe6';g.beginPath();g.ellipse(cx,cy,r,r*0.82,0,0,7);g.fill();
    g.fillStyle=brown?'#5d3a1f':'#1f2233';
    if(spot){g.beginPath();g.arc(cx-r*0.3,cy-r*0.2,r*0.28,0,7);g.arc(cx+r*0.35,cy+r*0.25,r*0.22,0,7);g.fill()}
    else{g.beginPath();g.arc(cx+r*0.25,cy-r*0.3,r*0.25,0,7);g.fill()}
  },
  draw(g){
    const c=this.cell;
    g.fillStyle='#1d3a24';g.fillRect(0,0,W,H);
    for(let y=0;y<this.rows;y++)for(let x=0;x<this.cols;x++){g.fillStyle=(x+y)%2?'#4f8a43':'#5a9a4c';g.fillRect(this.ox+x*c,this.oy+y*c,c,c)}
    g.strokeStyle='#7a5a36';g.lineWidth=4;g.strokeRect(this.ox-2,this.oy-2,this.cols*c+4,this.rows*c+4);
    const f=this.food,s=1+Math.sin(this.pulse*6)*0.06;
    this.cow(g,this.ox+(f.x+.5)*c,this.oy+(f.y+.5)*c,c*0.38*s,false,this.foodSpot);
    g.fillStyle='#e8d9a0';g.beginPath();g.moveTo(this.ox+(f.x+.2)*c,this.oy+(f.y+.2)*c);g.lineTo(this.ox+(f.x+.05)*c,this.oy+(f.y)*c);g.lineTo(this.ox+(f.x+.3)*c,this.oy+(f.y+.12)*c);g.fill();
    for(let i=this.snake.length-1;i>=1;i--){const p=this.snake[i];this.cow(g,this.ox+(p.x+.5)*c,this.oy+(p.y+.5)*c,c*0.42,i%3===1,i%2===0)}
    const h=this.snake[0],hx=this.ox+(h.x+.5)*c,hy=this.oy+(h.y+.5)*c;
    g.fillStyle='#6b4226';g.beginPath();g.arc(hx,hy,c*0.36,0,7);g.fill();
    g.fillStyle='#d63b2f';g.beginPath();g.arc(hx,hy,c*0.36,Math.PI*1.05,Math.PI*1.95);g.fill();g.fillRect(hx-c*0.42,hy-c*0.06,c*0.84,c*0.08);
    g.fillStyle='#fff';const ex=this.dir.x*c*0.12,ey=this.dir.y*c*0.12;
    g.beginPath();g.arc(hx-c*0.1+ex,hy+c*0.08+ey,c*0.06,0,7);g.arc(hx+c*0.1+ex,hy+c*0.08+ey,c*0.06,0,7);g.fill();
    g.strokeStyle='#c49a5a';g.lineWidth=3;g.beginPath();g.moveTo(hx+c*0.25,hy-c*0.1);g.lineTo(hx+c*0.25+this.dir.x*c*0.5+this.dir.y*c*0.2,hy-c*0.1+this.dir.y*c*0.5-c*0.3);g.stroke();
  }
};

/* ============ 5. MERGE THE RANDS ============ */
const LBL=['','R1','R2','R5','R10','R20','R50','R100','R200','R500','R1k','R2k','R5k','R10k'];
const VAL=[0,1,2,5,10,20,50,100,200,500,1000,2000,5000,10000];
const TIER=[null,{coin:'#c3c9d4',rim:'#9aa2b2',ink:'#2a3040'},{coin:'#d0d5de',rim:'#a6aebd',ink:'#2a3040'},{coin:'#d9b54a',rim:'#c3c9d4',ink:'#4a3606'},
  {note:'#6aa95a',ink:'#fff'},{note:'#a8744a',ink:'#fff'},{note:'#d1524a',ink:'#fff'},{note:'#4f78c9',ink:'#fff'},{note:'#e08a36',ink:'#fff'},
  {note:'#8e5bd1',ink:'#fff'},{note:'#1f9d8f',ink:'#fff'},{note:'#d4407a',ink:'#fff'},{note:'#ffc23d',ink:'#10172a'},{note:'#ffffff',ink:'#10172a'}];
const Merge={id:'merge',title:'Merge the Rands',hint:'Swipe to slide. Two of the same make the next coin or note.',swipe:true,
  init(){this.g=Array(16).fill(0);this.pop=Array(16).fill(0);this.born=Array(16).fill(0);this.won=false;this.toast=0;this.add();this.add()},
  add(){const e=[];this.g.forEach((v,i)=>{if(!v)e.push(i)});if(!e.length)return;const i=e[ri(e.length)];this.g[i]=Math.random()<0.9?1:2;this.born[i]=1},
  line(d,k){const a=[];for(let j=0;j<4;j++){let i;if(d==='L')i=k*4+j;else if(d==='R')i=k*4+3-j;else if(d==='U')i=j*4+k;else i=(3-j)*4+k;a.push(i)}return a},
  swipe(d){
    let moved=false,gain=0;this.pop.fill(0);
    for(let k=0;k<4;k++){
      const idx=this.line(d,k),vals=idx.map(i=>this.g[i]).filter(v=>v),out=[],pops=[];
      for(const v of vals){
        if(out.length&&out[out.length-1]===v&&!pops[out.length-1]&&v<LBL.length-1){out[out.length-1]=v+1;pops[out.length-1]=1;gain+=VAL[v+1]}
        else{out.push(v);pops.push(0)}
      }
      idx.forEach((i,j)=>{const nv=out[j]||0;if(nv!==this.g[i])moved=true;this.g[i]=nv;if(pops[j])this.pop[i]=1});
    }
    if(!moved)return;
    if(gain>0){Sfx.tone(523,.08,{type:'triangle',vol:.1});Sfx.tone(784,.16,{type:'triangle',vol:.1,delay:.06})}else Sfx.tone(300,.05,{type:'triangle',vol:.06});
    setScore(score+gain);this.add();
    if(!this.won&&this.g.some(v=>v>=8)){this.won=true;this.toast=2.2;[523,659,784,1047].forEach((f,i)=>Sfx.tone(f,.2,{type:'square',vol:.07,delay:i*.11}))}
    if(!this.canMove())end('No more moves');
  },
  canMove(){for(let i=0;i<16;i++){if(!this.g[i])return true;const r=i>>2,c=i&3;if(c<3&&this.g[i]===this.g[i+1])return true;if(r<3&&this.g[i]===this.g[i+4])return true}return false},
  update(dt){for(let i=0;i<16;i++){this.pop[i]=Math.max(0,this.pop[i]-dt*5);this.born[i]=Math.max(0,this.born[i]-dt*6)}this.toast=Math.max(0,this.toast-dt)},
  draw(g){
    g.fillStyle='#10172a';g.fillRect(0,0,W,H);
    const S=Math.min(W-32,H-90,460),x0=(W-S)/2,y0=Math.max(56,(H-S)/2),gap=S*0.03,t=(S-gap*5)/4;
    g.fillStyle='#1a2340';rr(g,x0,y0,S,S,18);g.fill();
    for(let i=0;i<16;i++){
      const r=i>>2,c=i&3,x=x0+gap+c*(t+gap),y=y0+gap+r*(t+gap),v=this.g[i];
      g.fillStyle='#232d52';rr(g,x,y,t,t,12);g.fill();
      if(!v)continue;
      const sc=(1+this.pop[i]*0.14)*(1-this.born[i]*0.6),cx=x+t/2,cy=y+t/2;
      g.save();g.translate(cx,cy);g.scale(sc,sc);
      const T=TIER[v];
      if(T.coin){
        g.fillStyle=T.rim;g.beginPath();g.arc(0,0,t*0.42,0,7);g.fill();
        g.fillStyle=T.coin;g.beginPath();g.arc(0,0,t*0.34,0,7);g.fill();
        if(v===3){g.fillStyle='#c3c9d4';g.beginPath();g.arc(0,0,t*0.22,0,7);g.fill()}
      }else{
        g.fillStyle=T.note;rr(g,-t/2,-t*0.36,t,t*0.72,10);g.fill();
        g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;rr(g,-t/2+6,-t*0.36+6,t-12,t*0.72-12,6);g.stroke();
      }
      const lab=LBL[v];g.fillStyle=T.ink;g.textAlign='center';g.textBaseline='middle';
      g.font=`${Math.round(t*(lab.length>3?0.22:0.28))}px ${FONT}`;g.fillText(lab,0,2);g.textBaseline='alphabetic';
      g.restore();
    }
    g.textAlign='center';g.font=`800 13px ${BODY}`;g.fillStyle='#98a2c4';
    const top=Math.max(...this.g);
    g.fillText('Biggest so far: '+(LBL[top]||'—')+'   ·   Goal: R200',W/2,Math.min(H-18,y0+S+30));
    if(this.toast>0){g.globalAlpha=Math.min(1,this.toast);g.fillStyle='#ffc23d';g.font=`26px ${FONT}`;g.fillText('R200 MADE!',W/2,y0-16);g.globalAlpha=1}
  }
};

const ICON={
  stack:'<svg viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#2d2a5a"/><rect x="12" y="38" width="32" height="8" fill="#e8913a"/><rect x="15" y="29" width="28" height="8" fill="#e8c23a"/><rect x="13" y="20" width="26" height="8" fill="#9bd146"/><rect x="18" y="11" width="22" height="8" fill="#ffc23d" opacity=".6"/></svg>',
  bottle:'<svg viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#161f3a"/><rect x="6" y="42" width="44" height="5" fill="#3a4370"/><rect x="11" y="22" width="10" height="20" rx="3" fill="#e7edf6"/><rect x="13" y="16" width="6" height="5" fill="#2f7de1"/><rect x="31" y="22" width="10" height="20" rx="3" fill="#f39a3a"/><rect x="33" y="16" width="6" height="5" fill="#2f7de1"/></svg>',
  road:'<svg viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#3b6e36"/><rect x="14" y="0" width="28" height="56" fill="#a07e57"/><rect x="27" y="6" width="2" height="8" fill="#e9d8bd"/><rect x="27" y="22" width="2" height="8" fill="#e9d8bd"/><rect x="21" y="34" width="14" height="18" rx="4" fill="#ffc23d"/><ellipse cx="22" cy="14" rx="5" ry="3" fill="#2b2016"/></svg>',
  herd:'<svg viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#5a9a4c"/><circle cx="14" cy="36" r="7" fill="#f3efe6"/><circle cx="25" cy="36" r="7" fill="#8a5a34"/><circle cx="36" cy="36" r="7" fill="#f3efe6"/><circle cx="36" cy="24" r="6.5" fill="#6b4226"/><path d="M29.5 24a6.5 6.5 0 0 1 13 0z" fill="#d63b2f"/></svg>',
  merge:'<svg viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#232d52"/><circle cx="19" cy="22" r="9" fill="#c3c9d4"/><circle cx="37" cy="22" r="9" fill="#d9b54a"/><rect x="10" y="34" width="36" height="14" rx="3" fill="#e08a36"/><text x="28" y="44.5" text-anchor="middle" font-family="Bungee,Impact,sans-serif" font-size="9" fill="#fff">R200</text></svg>'
};
const GAMES=[
  [Stack,'Drop swinging blocks. Overhang gets sliced off.'],
  [Bottle,'Reject bad bottles before the belt beats you.'],
  [Road,'Swipe to dodge potholes, goats and sudden taxis.'],
  /* Herdboy parked for now: [Herd,'Snake, village style. Grow your herd.'], */
  [Merge,'2048 with money. Work your way to R200.']
];
function renderMenu(){
  const L=$('list');L.innerHTML='';
  for(const [g,desc] of GAMES){
    const b=document.createElement('button');b.className='game';b.id='g_'+g.id;
    b.innerHTML=`${ICON[g.id]}<div class="txt"><h2>${g.title}</h2><p>${desc}</p></div><div class="best"><small>Best</small><b>${store.get('ekhaya_best_'+g.id,0)}</b></div>`;
    b.onclick=()=>openGame(g);L.appendChild(b);
  }
}
renderMenu();
})();
